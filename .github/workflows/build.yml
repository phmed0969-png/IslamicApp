
name: Build IslamicApp APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-22.04

    env:
      ANDROIDSDK: /home/runner/.buildozer/android/platform/android-sdk
      ANDROID_HOME: /home/runner/.buildozer/android/platform/android-sdk
      ANDROID_SDK_ROOT: /home/runner/.buildozer/android/platform/android-sdk

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            cmake libffi-dev libssl-dev

      - name: Install Android SDK
        run: |
          SDK_DIR="$HOME/.buildozer/android/platform/android-sdk"
          mkdir -p "$SDK_DIR"

          SOURCE_SDK="/usr/local/lib/android/sdk"
          SDKMANAGER="$(find "$SOURCE_SDK/cmdline-tools" -name sdkmanager -type f | head -n 1)"

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found"
            exit 1
          fi

          echo "Using SDK manager: $SDKMANAGER"
          echo "Installing Android SDK into: $SDK_DIR"

          yes | "$SDKMANAGER" --sdk_root="$SDK_DIR" --licenses

          "$SDKMANAGER" --sdk_root="$SDK_DIR" "cmdline-tools;latest"
          "$SDKMANAGER" --sdk_root="$SDK_DIR" "platform-tools"
          "$SDKMANAGER" --sdk_root="$SDK_DIR" "platforms;android-35"
          "$SDKMANAGER" --sdk_root="$SDK_DIR" "build-tools;35.0.0"

          mkdir -p "$SDK_DIR/tools/bin"

          SDKMANAGER_INSTALLED="$(find "$SDK_DIR/cmdline-tools" -name sdkmanager -type f | head -n 1)"

          if [ -z "$SDKMANAGER_INSTALLED" ]; then
            SDKMANAGER_INSTALLED="$SDKMANAGER"
          fi

          ln -sf "$SDKMANAGER_INSTALLED" "$SDK_DIR/tools/bin/sdkmanager"

          echo "ANDROIDSDK=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"

          echo "Checking SDK files..."
          ls -l "$SDK_DIR/tools/bin/sdkmanager"
          ls -l "$SDK_DIR/build-tools/35.0.0/aidl"
          ls -ld "$SDK_DIR/platforms/android-35"

      - name: Install Buildozer
        run: |
          python -m pip install --upgrade pip setuptools wheel
          pip install buildozer cython==0.29.36

      - name: Build APK
        run: |
          buildozer -v android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IslamicApp-APK
          path: bin/*.apk
          if-no-files-found: error
